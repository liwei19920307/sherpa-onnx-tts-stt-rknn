name: Sherpa Onnx TTS/STT
version: "0.3.9-rknn"
slug: sherpa_onnx_tts_stt
description: >-
  Sherpa-onnx TTS/STT with wyoming. On Rockchip (RK3566/RK3588): STT SenseVoice/
  Paraformer via NPU; TTS Melo/Piper hybrid (encoder CPU + decoder NPU) or CPU models.
  瑞芯微：STT 可走 NPU；TTS 可选 Melo/Piper 混合 NPU 或纯 CPU。
url: https://github.com/ptbsare/sherpa-onnx-tts-stt
arch:
  - amd64
  - aarch64
startup: application
discovery:
  - wyoming
backup_exclude: []
boot: auto
init: false
privileged:
  - SYS_ADMIN
devices:
  - /dev/dri
  - /dev/rknpu
udev: true
options:
    language: zh-CN
    speed: 1.0
    provider: auto
    rk_soc: ""
    stt_model: rknn-sense-voice
    stt_use_int8_onnx_model: True
    stt_builtin_auto_convert_number: False
    stt_use_online_processing: False
    stt_thread_num: 1
    tts_model: melo-rknn-zh_en
    tts_thread_num: 2
    tts_speaker_sid: 0
    debug: False
schema:
    language: str
    speed: float
    provider: |
      list(auto|cpu|rknn|cuda)
    rk_soc: str?
    stt_model: |
      list(rknn-sense-voice|rknn-paraformer-zh|sherpa-onnx-paraformer-zh-2023-03-28|sherpa-onnx-paraformer-zh-small-2024-03-09|custom_stt_model)
    stt_use_int8_onnx_model: bool
    stt_builtin_auto_convert_number: bool
    stt_use_online_processing: bool
    stt_thread_num: int
    tts_model: |
      list(melo-rknn-zh_en|piper-rknn-zh|vits-melo-tts-zh_en|matcha-icefall-zh-baker|kokoro-int8-multi-lang-v1_1|custom_tts_model)
    tts_thread_num: int
    tts_speaker_sid: int
    debug: bool
    custom_stt_model: str? 
    custom_stt_model_eval: str?
    custom_tts_model: str? 
    custom_tts_model_eval: str?
ports:
  10400/tcp: 10400
  10500/tcp: 10500
homeassistant: 2023.8.0.dev20230728
# Comment image when building locally from this fork
# image: "ghcr.io/ptbsare/home-assistant-addons/{arch}-addon-sherpa-onnx-tts-stt"

# 正式部署：镜像内已含模型与代码，不要再挂 /opt/sherpa/app 或 models。
#   docker compose -f docker-compose.rknn.yml pull
#   docker compose -f docker-compose.rknn.yml up -d

services:
  sherpa:
    image: liwei19920307/sherpa-onnx-tts-stt:rknn
    container_name: sherpa
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      PROVIDER: rknn
      # 空=读 device-tree（rk3588 / rk3566 / rk3568）
      RK_SOC: ""
      LANGUAGE: zh-CN
      STT_MODEL: rknn-sense-voice
      STT_THREAD_NUM: "1"
      TTS_MODEL: kokoro-rknn
      KOKORO_VOICE: zf_001
    volumes:
      # 仅主机运行时库 + NPU debug（可选 localtime）
      - /etc/localtime:/etc/localtime:ro
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro

services:
  sherpa-onnx-tts-stt:
    image: liwei19920307/sherpa-onnx-tts-stt:rknn
    build:
      context: .
      dockerfile: Dockerfile.rknn
      network: host
      args:
        # Optional: set when the board needs an HTTP proxy to pull packages
        # http_proxy: http://127.0.0.1:7890
        # https_proxy: http://127.0.0.1:7890
    container_name: sherpa-onnx-tts-stt-rknn
    restart: unless-stopped
    # No /dev/rknpu on some Armbian kernels; privileged exposes NPU.
    privileged: true
    ports:
      - "10400:10400"
      - "10500:10500"
    environment:
      PROVIDER: rknn
      RK_SOC: ""
      LANGUAGE: zh-CN
      STT_MODEL: rknn-sense-voice
      STT_THREAD_NUM: "1"
      TTS_MODEL: melo-rknn-zh_en
      TTS_THREAD_NUM: "2"
      TTS_SPEAKER_SID: "0"
      SPEED: "1.0"
      MELO_RKNN_DIR: /tts-models/melo-rknn
      PIPER_RKNN_DIR: /tts-models/piper-zh
      DEBUG: "False"
      CUSTOM_STT_MODEL_EVAL: "null"
      CUSTOM_TTS_MODEL_EVAL: "null"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      # First-boot layout on device:
      #   /opt/sherpa/models/stt/<sensevoice>/
      #   /opt/sherpa/models/tts/melo-rknn/
      - /opt/sherpa/models/stt:/stt-models:ro
      - /opt/sherpa/models/tts:/tts-models:ro
